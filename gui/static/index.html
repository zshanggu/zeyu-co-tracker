<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoTracker Workbench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CoTracker Workbench</h1>
    <span class="hint">Each row: track video A (left) and video B (middle), then compare them (right). All blocks play in sync by frame number.</span>
  </header>

  <main id="grid"></main>

  <footer id="transport">
    <button id="btn-first" title="First frame">⏮</button>
    <button id="btn-prev" title="Previous frame (←)">◀</button>
    <button id="btn-play" class="primary" title="Play / pause (space)">Play</button>
    <button id="btn-next" title="Next frame (→)">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1">
    <span id="frame-label">Frame 0 / 0</span>
    <label class="speed">Speed
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </label>
  </footer>

  <!-- Pick a source video (server files or upload) -->
  <dialog id="picker">
    <form method="dialog" class="dlg">
      <h2>Select source video</h2>
      <div id="picker-path"></div>
      <input id="picker-filter" type="search" placeholder="Filter this folder…" autocomplete="off">
      <ul id="picker-list"></ul>
      <div class="dlg-row">
        <button type="button" id="picker-upload-btn" class="link"
                title="For videos on another computer: the server gets a copy">Upload from this computer…</button>
        <input id="picker-upload" type="file" accept="video/*" hidden>
        <span id="picker-status"></span>
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- Parameters for tracking / compare -->
  <dialog id="params">
    <form method="dialog" class="dlg">
      <h2 id="params-title">Parameters</h2>
      <div id="params-fields" class="fields"></div>
      <div class="dlg-row">
        <span class="spacer"></span>
        <button value="cancel">Close</button>
        <button value="run" class="primary" id="params-run">Save &amp; run</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
